name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 优化1: 使用 GitHub Actions 缓存 AutoHotkey
      - name: Cache AutoHotkey
        id: cache-ahk
        uses: actions/cache@v4
        with:
          path: |
            C:\AutoHotkey
            ~/.cache/autohotkey
          key: autohotkey-${{ runner.os }}-v2.0.18
          restore-keys: |
            autohotkey-${{ runner.os }}-
            autohotkey-

      # 优化2: 使用社区维护的 install-autohotkey action
      - name: Install AutoHotkey v2.0.18
        id: install-ahk
        uses: holy-tao/install-autohotkey@v1
        with:
          version: '2.0.18'
          compiler: 'Ahk2Exe1.1.37.02a0a'
          destination: 'C:\AutoHotkey'
        if: steps.cache-ahk.outputs.cache-hit != 'true'

      - name: Display AutoHotkey installation
        run: |
          Write-Host "AutoHotkey version: ${{ steps.install-ahk.outputs.version }}"
          Write-Host "AHK32: ${{ steps.install-ahk.outputs.ahk32 }}"
          Write-Host "AHK64: ${{ steps.install-ahk.outputs.ahk64 }}"
          Write-Host "Compiler: C:\AutoHotkey\Compiler\Ahk2Exe.exe"
          & "C:\AutoHotkey\AutoHotkey64.exe" --version 2>&1 | Select-Object -First 1

      # 优化3: 并行编译32位和64位版本
      - name: Compile Work.ahk (parallel)
        run: |
          $compiler = "C:\AutoHotkey\Compiler\Ahk2Exe.exe"
          $ws = "${{ github.workspace }}"

          # 并行编译 32/64 位
          $job32 = Start-Job -ScriptBlock {
            param($c, $ws)
            & $c /in "$ws\Thread\Work.ahk" /out "$ws\ReleaseX32\Thread\Work1.exe" /bin "C:\AutoHotkey\AutoHotkey32.exe" /compress 0
          } -ArgumentList $compiler, $ws

          $job64 = Start-Job -ScriptBlock {
            param($c, $ws)
            & $c /in "$ws\Thread\Work.ahk" /out "$ws\ReleaseX64\Thread\Work1.exe" /bin "C:\AutoHotkey\AutoHotkey64.exe" /compress 0
          } -ArgumentList $compiler, $ws

          Wait-Job $job32, $job64 | Receive-Job
          Remove-Job *

      - name: Compile RMT.ahk (parallel)
        run: |
          $compiler = "C:\AutoHotkey\Compiler\Ahk2Exe.exe"
          $ws = "${{ github.workspace }}"
          $icon = "$ws\Images\Soft\rabit.ico"

          $job32 = Start-Job -ScriptBlock {
            param($c, $ws, $icon)
            & $c /in "$ws\RMT.ahk" /out "$ws\ReleaseX32\RMT.exe" /icon $icon /bin "C:\AutoHotkey\AutoHotkey32.exe" /compress 0
          } -ArgumentList $compiler, $ws, $icon

          $job64 = Start-Job -ScriptBlock {
            param($c, $ws, $icon)
            & $c /in "$ws\RMT.ahk" /out "$ws\ReleaseX64\RMT.exe" /icon $icon /bin "C:\AutoHotkey\AutoHotkey64.exe" /compress 0
          } -ArgumentList $compiler, $ws, $icon

          Wait-Job $job32, $job64 | Receive-Job
          Remove-Job *

      # 优化4: 并行复制依赖文件
      - name: Copy dependencies (parallel)
        run: |
          $ws = "${{ github.workspace }}"

          $job32 = Start-Job -ScriptBlock {
            param($ws)
            Copy-Item -Path "$ws\Audio\*.wav" -Destination "$ws\ReleaseX32\Audio\" -Force
            Copy-Item -Path "$ws\Joy\*.png" -Destination "$ws\ReleaseX32\Joy\" -Force
            Copy-Item -Path "$ws\Lang\*.txt" -Destination "$ws\ReleaseX32\Lang\" -Force
            Copy-Item -Path "$ws\VBS\*.vbs" -Destination "$ws\ReleaseX32\VBS\" -Force
            Copy-Item -Path "$ws\Plugins\*.ahk" -Destination "$ws\ReleaseX32\Plugins\" -Force
            Copy-Item -Path "$ws\Plugins\RapidOcr\*" -Destination "$ws\ReleaseX32\Plugins\RapidOcr\" -Recurse -Force
            Copy-Item -Path "$ws\Plugins\OpenCV\*" -Destination "$ws\ReleaseX32\Plugins\OpenCV\" -Recurse -Force
            Copy-Item -Path "$ws\Joy\XOutput\*" -Destination "$ws\ReleaseX32\Joy\XOutput\" -Recurse -Force
          } -ArgumentList $ws

          $job64 = Start-Job -ScriptBlock {
            param($ws)
            Copy-Item -Path "$ws\Audio\*.wav" -Destination "$ws\ReleaseX64\Audio\" -Force
            Copy-Item -Path "$ws\Joy\*.png" -Destination "$ws\ReleaseX64\Joy\" -Force
            Copy-Item -Path "$ws\Lang\*.txt" -Destination "$ws\ReleaseX64\Lang\" -Force
            Copy-Item -Path "$ws\VBS\*.vbs" -Destination "$ws\ReleaseX64\VBS\" -Force
            Copy-Item -Path "$ws\Plugins\*.ahk" -Destination "$ws\ReleaseX64\Plugins\" -Force
            Copy-Item -Path "$ws\Plugins\RapidOcr\*" -Destination "$ws\ReleaseX64\Plugins\RapidOcr\" -Recurse -Force
            Copy-Item -Path "$ws\Plugins\OpenCV\*" -Destination "$ws\ReleaseX64\Plugins\OpenCV\" -Recurse -Force
            Copy-Item -Path "$ws\Joy\XOutput\*" -Destination "$ws\ReleaseX64\Joy\XOutput\" -Recurse -Force
          } -ArgumentList $ws

          Wait-Job $job32, $job64 | Receive-Job
          Remove-Job *

      # 优化5: 并行打包压缩
      - name: Create packages (parallel)
        run: |
          $ws = "${{ github.workspace }}"

          $job32 = Start-Job -ScriptBlock {
            param($ws)
            Compress-Archive -Path "$ws\ReleaseX32\*" -DestinationPath "$ws\RMT_x32.zip" -Force
          } -ArgumentList $ws

          $job64 = Start-Job -ScriptBlock {
            param($ws)
            Compress-Archive -Path "$ws\ReleaseX64\*" -DestinationPath "$ws\RMT_x64.zip" -Force
          } -ArgumentList $ws

          Wait-Job $job32, $job64 | Receive-Job
          Remove-Job *

      - name: Get version from tag
        id: get_version
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $matches[1]
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "Version: $version"
          } else {
            echo "version=latest" >> $env:GITHUB_OUTPUT
            echo "No tag found, using latest"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: RMT ${{ steps.get_version.outputs.version }}
          body: |
            ## 🎉 RMT ${{ steps.get_version.outputs.version }} 发布

            ### 下载
            - **32位版本**: RMT_x32.zip
            - **64位版本**: RMT_x64.zip

            ### 使用说明
            1. 根据你的系统选择下载 32 位或 64 位版本
            2. 解压到任意目录
            3. 运行 RMT.exe 即可使用

            ### 更新内容
            请查看 [更新日志](https://github.com/yunkuangao/rmt/blob/master/Web/更新日志.md)
          files: |
            RMT_x32.zip
            RMT_x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

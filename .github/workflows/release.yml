name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 优化1: 使用缓存，避免重复下载 AutoHotkey
      - name: Cache AutoHotkey
        id: cache-ahk
        uses: actions/cache@v4
        with:
          path: C:\Program Files\AutoHotkey
          key: autohotkey-v2.0.18

      # 优化2: 仅在缓存未命中时下载安装
      - name: Setup AutoHotkey v2
        if: steps.cache-ahk.outputs.cache-hit != 'true'
        run: |
          $ahkUrl = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.18/AutoHotkey_2.0.18_setup.exe"
          $ahkPath = "$env:TEMP\AutoHotkey_2.0.18_setup.exe"
          Invoke-WebRequest -Uri $ahkUrl -OutFile $ahkPath
          Start-Process -FilePath $ahkPath -ArgumentList "/S" -Wait

      - name: Verify AutoHotkey installation
        run: |
          $ahkPath = "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe"
          if (Test-Path $ahkPath) {
            Write-Host "AutoHotkey compiler found at $ahkPath"
          } else {
            Write-Error "AutoHotkey compiler not found!"
            exit 1
          }

      # 优化3: 并行编译32位和64位版本
      - name: Compile Work.ahk (32-bit & 64-bit)
        run: |
          $compiler = "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe"
          $iconPath = "${{ github.workspace }}\Images\Soft\rabit.ico"

          # 并行编译
          Start-Job -ScriptBlock {
            param($c, $ws)
            & $c /in "$ws\Thread\Work.ahk" /out "$ws\ReleaseX32\Thread\Work1.exe" /bin "C:\Program Files\AutoHotkey\v2\AutoHotkey32.exe" /compress 0
          } -ArgumentList $compiler, "${{ github.workspace }}" | Out-Null

          Start-Job -ScriptBlock {
            param($c, $ws)
            & $c /in "$ws\Thread\Work.ahk" /out "$ws\ReleaseX64\Thread\Work1.exe" /bin "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe" /compress 0
          } -ArgumentList $compiler, "${{ github.workspace }}" | Out-Null

          # 等待所有编译完成
          Get-Job | Wait-Job | Receive-Job
          Remove-Job *

      # 优化4: 并行编译 RMT 主程序
      - name: Compile RMT.ahk (32-bit & 64-bit)
        run: |
          $compiler = "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe"
          $iconPath = "${{ github.workspace }}\Images\Soft\rabit.ico"

          Start-Job -ScriptBlock {
            param($c, $ws, $icon)
            & $c /in "$ws\RMT.ahk" /out "$ws\ReleaseX32\RMT.exe" /icon $icon /bin "C:\Program Files\AutoHotkey\v2\AutoHotkey32.exe" /compress 0
          } -ArgumentList $compiler, "${{ github.workspace }}", $iconPath | Out-Null

          Start-Job -ScriptBlock {
            param($c, $ws, $icon)
            & $c /in "$ws\RMT.ahk" /out "$ws\ReleaseX64\RMT.exe" /icon $icon /bin "C:\Program Files\AutoHotkey\v2\AutoHotkey64.exe" /compress 0
          } -ArgumentList $compiler, "${{ github.workspace }}", $iconPath | Out-Null

          Get-Job | Wait-Job | Receive-Job
          Remove-Job *

      # 优化5: 并行复制依赖文件
      - name: Copy dependencies (parallel)
        run: |
          # 32位复制任务
          $job32 = Start-Job -ScriptBlock {
            param($ws)
            Copy-Item -Path "$ws\Audio\*.wav" -Destination "$ws\ReleaseX32\Audio\" -Force
            Copy-Item -Path "$ws\Joy\*.png" -Destination "$ws\ReleaseX32\Joy\" -Force
            Copy-Item -Path "$ws\Lang\*.txt" -Destination "$ws\ReleaseX32\Lang\" -Force
            Copy-Item -Path "$ws\VBS\*.vbs" -Destination "$ws\ReleaseX32\VBS\" -Force
            Copy-Item -Path "$ws\Plugins\*.ahk" -Destination "$ws\ReleaseX32\Plugins\" -Force
            Copy-Item -Path "$ws\Plugins\RapidOcr\*" -Destination "$ws\ReleaseX32\Plugins\RapidOcr\" -Recurse -Force
            Copy-Item -Path "$ws\Plugins\OpenCV\*" -Destination "$ws\ReleaseX32\Plugins\OpenCV\" -Recurse -Force
            Copy-Item -Path "$ws\Joy\XOutput\*" -Destination "$ws\ReleaseX32\Joy\XOutput\" -Recurse -Force
          } -ArgumentList "${{ github.workspace }}"

          # 64位复制任务
          $job64 = Start-Job -ScriptBlock {
            param($ws)
            Copy-Item -Path "$ws\Audio\*.wav" -Destination "$ws\ReleaseX64\Audio\" -Force
            Copy-Item -Path "$ws\Joy\*.png" -Destination "$ws\ReleaseX64\Joy\" -Force
            Copy-Item -Path "$ws\Lang\*.txt" -Destination "$ws\ReleaseX64\Lang\" -Force
            Copy-Item -Path "$ws\VBS\*.vbs" -Destination "$ws\ReleaseX64\VBS\" -Force
            Copy-Item -Path "$ws\Plugins\*.ahk" -Destination "$ws\ReleaseX64\Plugins\" -Force
            Copy-Item -Path "$ws\Plugins\RapidOcr\*" -Destination "$ws\ReleaseX64\Plugins\RapidOcr\" -Recurse -Force
            Copy-Item -Path "$ws\Plugins\OpenCV\*" -Destination "$ws\ReleaseX64\Plugins\OpenCV\" -Recurse -Force
            Copy-Item -Path "$ws\Joy\XOutput\*" -Destination "$ws\ReleaseX64\Joy\XOutput\" -Recurse -Force
          } -ArgumentList "${{ github.workspace }}"

          Wait-Job $job32, $job64 | Receive-Job
          Remove-Job *

      # 优化6: 并行打包压缩
      - name: Create packages (parallel)
        run: |
          $job32 = Start-Job -ScriptBlock {
            param($ws)
            Compress-Archive -Path "$ws\ReleaseX32\*" -DestinationPath "$ws\RMT_x32.zip" -Force
          } -ArgumentList "${{ github.workspace }}"

          $job64 = Start-Job -ScriptBlock {
            param($ws)
            Compress-Archive -Path "$ws\ReleaseX64\*" -DestinationPath "$ws\RMT_x64.zip" -Force
          } -ArgumentList "${{ github.workspace }}"

          Wait-Job $job32, $job64 | Receive-Job
          Remove-Job *

      - name: Get version from tag
        id: get_version
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $matches[1]
            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "Version: $version"
          } else {
            echo "version=latest" >> $env:GITHUB_OUTPUT
            echo "No tag found, using latest"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: RMT ${{ steps.get_version.outputs.version }}
          body: |
            ## 🎉 RMT ${{ steps.get_version.outputs.version }} 发布

            ### 下载
            - **32位版本**: RMT_x32.zip
            - **64位版本**: RMT_x64.zip

            ### 使用说明
            1. 根据你的系统选择下载 32 位或 64 位版本
            2. 解压到任意目录
            3. 运行 RMT.exe 即可使用

            ### 更新内容
            请查看 [更新日志](https://github.com/yunkuangao/rmt/blob/master/Web/更新日志.md)
          files: |
            RMT_x32.zip
            RMT_x64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
